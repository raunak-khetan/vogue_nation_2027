<!-- GSAP Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const track = document.querySelector('.carousel-track');
    const images = document.querySelectorAll('.carousel-img');
    const viewport = document.querySelector('.carousel-viewport');
    if (!track || !viewport) return;

    // Tight 3px Spacing: 280px width + 3px gap = 283px per slot
    const imgWidth = 280;
    const gap = 3;
    const itemSpacing = imgWidth + gap; // 283px
    const singleSetWidth = 5 * itemSpacing; // 1,415px
    
    let scrollPos = 0;
    const autoSpeed = 1.0; 
    let isDragging = false;
    let startX = 0;
    let startScroll = 0;

    function render() {
        const trackX = -(scrollPos % singleSetWidth);
        track.style.transform = `translateX(${trackX}px)`;

        const viewportCenter = window.innerWidth / 2;

        images.forEach((img, i) => {
            // Position relative to viewport center
            const imgCenter = trackX + (i * itemSpacing) + (imgWidth / 2);
            const signedDist = imgCenter - viewportCenter;
            const dist = Math.abs(signedDist);
            const normDist = Math.min(dist / viewportCenter, 1.0);

            // CURVE: 74% size at center, 100% size at sides
            const minScale = 0.74;
            const maxScale = 1.0;
            const scale = minScale + (normDist * (maxScale - minScale));

            // Squeeze compensation tuned for tight 3px spacing (keeps images right together)
            const shiftX = -Math.tanh(signedDist / 340) * 73;

            img.style.transform = `translateX(${shiftX}px) scale(${scale})`;
            img.style.transformOrigin = "center center";
        });
    }

    // Auto-scroll loop
    gsap.ticker.add(() => {
        if (!isDragging) {
            scrollPos += autoSpeed;
            render();
        }
    });

    // Mouse wheel horizontal scroll
    viewport.addEventListener('wheel', (e) => {
        e.preventDefault(); 
        scrollPos += (e.deltaY + e.deltaX) * 0.8;
        if (scrollPos < 0) scrollPos += singleSetWidth * 10;
        render();
    }, { passive: false });

    // Mouse drag
    track.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startScroll = scrollPos;
        track.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const delta = e.clientX - startX;
        scrollPos = startScroll - delta * 1.2;
        if (scrollPos < 0) scrollPos += singleSetWidth * 10;
        render();
    });

    window.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            track.style.cursor = 'grab';
        }
    });

    // Mobile touch support
    track.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].clientX;
        startScroll = scrollPos;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const delta = e.touches[0].clientX - startX;
        scrollPos = startScroll - delta * 1.2;
        if (scrollPos < 0) scrollPos += singleSetWidth * 10;
        render();
    }, { passive: true });

    window.addEventListener('touchend', () => {
        isDragging = false;
    });

    window.addEventListener('resize', render);
});
</script>
